third_party_documents:
  vendor: SafeBase
  reasoning: >-
    security.termscout.com is TermScout's trust centre, hosted by SafeBase (now
    part of Drata). The DNS name is TermScout's, but every byte of the response
    is SafeBase's application — the 404 page title is "SafeBase", assets load
    from cdn.safebase.io, and the served discovery documents name
    https://app.safebase.io/api/mcp as issuer, authorization server, token
    endpoint and protected resource, with service_documentation at
    https://docs.safebase.io/mcp. Nothing in them refers to TermScout or to any
    TermScout-operated endpoint. Under the pipeline's ownership rule a document
    is judged by what it says about itself, not by where it was fetched, so
    these are recorded as vendor boilerplate reachable at a TermScout hostname —
    not as a TermScout discovery surface. Saved verbatim for auditability only.
  issuer: https://app.safebase.io/api/mcp
  implies_termscout_mcp: false
  note: >-
    These documents advertise an MCP authorization server. That server is
    SafeBase's shared trust-centre MCP, not a TermScout API surface, and
    https://security.termscout.com/mcp returns SafeBase's 404 page. No MCPServer
    pointer is warranted.

