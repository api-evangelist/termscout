aid: termscout
name: TermScout
description: >-
  TermScout is a contract intelligence and certification company for legal,
  procurement, and sales teams. Its platform analyzes and benchmarks commercial
  agreements against market standards, generates contract signals through
  Certify (AI contract analysis), and certifies contracts with TrustMark as an
  external, third-party signal of fairness that helps buyers and sellers close
  deals faster with less negotiation. TermScout was surfaced as a Techstars
  portfolio company and profiled in the API Evangelist network. TermScout does
  publish a machine-readable contract: an OpenAPI 3.0.1 definition for the
  "termscout-data" API is served anonymously at https://api.termscout.com/docs,
  covering contract upload, processing status, extracted fields, citations,
  predicted labels and red flags, playbook results, and aggregate market data
  across contract positions. The API itself is key-gated (x-api-key plus an
  Authorization bearer credential) and access is arranged through sales; there
  is no self-serve developer portal, SDK, or published API reference. Its
  end-user products are delivered through the app.termscout.com web
  application, which also publishes an llms.txt index of public TrustMark
  contract reports.
