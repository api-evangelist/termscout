note: >-
  DERIVED FROM AN ABSENCE, and that absence is the finding. All 11 operations in
  the published termscout-data OpenAPI declare exactly one response each — 200 —
  with no 4xx and no 5xx anywhere in the document. There is no error reference on
  termscout.com, app.termscout.com or the learn.termscout.com help centre either,
  so there is nothing to search-upgrade this with. A consumer integrating against
  this contract has no published way to know what a failure looks like, which
  status codes are possible, or how to distinguish a retryable error from a
  permanent one.
