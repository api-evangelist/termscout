source: openapi/termscout-data-openapi.yml
note: >-
  TermScout ships NO MCP server. This is a DERIVED candidate tool list, one tool
  per operation in the published termscout-data OpenAPI, provided so an
  integrator can stand one up. It is not a TermScout product and no MCPServer
  pointer is wired into apis.yml.

deployment:
  mode: none
  auth: api-key
  verified: derived
  note: >-
    Nothing to reach. No hosted endpoint and no installable package exist, so
    endpoint/install/package are deliberately absent rather than guessed. auth
    records what a server WOULD need (x-api-key + Authorization), taken from the
    spec's securitySchemes.

