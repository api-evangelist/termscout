    detail: >-
      The /.well-known OAuth documents served at security.termscout.com describe
      an MCP server, but its issuer and resource are both
      https://app.safebase.io/api/mcp — SafeBase's own trust-centre MCP, not
      TermScout's. Explicitly NOT counted as a TermScout MCP surface. See
