    target: Contract
    via: contract_id
  - type: has_many
    target: Label
    via: details[].flags[].label_id

- name: PredictionSummary
  description: Narrative summary of predictions for one topic on one contract.
  schemas:
  - PredictionSummary
  key_fields:
  - summary
  relationships:
  - type: belongs_to
    target: Contract
    via: contract_id
  - type: belongs_to
    target: Topic
    via: topic_id

- name: PlaybookDetail
  description: >-
    Playbook evaluation of a contract — per-question pass/fail against required,
    acceptable and unacceptable label sets, with tier and rank.
  schemas:
  - PlaybookDetail
  - PlaybookPassFailDetail
  key_fields:
  - tier
  - issue_number
  - display_name
  - answer_display
  - filter_passed
  - rank
  - citation
  relationships:
  - type: belongs_to
    target: Contract
    via: contract-id
  - type: belongs_to
    target: Question
    via: question_id
  - type: has_many
    target: Label
    via: selected_label_ids / unselected_label_ids / required_label_ids / acceptable_label_ids / unacceptable_label_ids

- name: ContractPosition
  description: >-
    The party that drafted the contract form. The spec states "Use '1' for vendor
    form" on the contract-position-id parameter. Doubles as the grouping
    dimension for the market-data endpoint.
  identifier: id
  identifier_type: number
  schemas:
  - ContractPosition
  - ContractPositions
  key_fields:
  - name
  - quantity
  known_values:
  - id: 1
    meaning: vendor form
    source: POST /contracts contract-position-id parameter description
  operations:
  - GET /contract-positions

- name: Label
  description: >-
    An atomic contract characteristic that the model predicts true/false with a
    confidence score. The unit of both prediction and market benchmarking.
  identifier: label_id
  identifier_type: number
  exposed_as_endpoint: false
  key_fields:
  - label_display
  - confidence
  - selected
  - defined_term
  note: >-
    Referenced by five different schemas and three query parameters, but there is
    NO endpoint to enumerate labels. Like templates, label ids must be obtained
    out of band.

- name: Topic
  description: Grouping of labels; the unit of prediction summaries.
  identifier: topic_id
  identifier_type: number
  exposed_as_endpoint: false
  key_fields:
  - topic_name

- name: Question
  description: A substantive question asked of the contract; backs playbook detail and citations.
  identifier: question_id
  identifier_type: number
  exposed_as_endpoint: false

referenced_but_undefined:
  note: >-
    These are referenced by id fields on returned objects but have no schema and
