note: >-
  Entity graph derived from the 21 component schemas and the $ref/id-reference
  fields in the published termscout-data OpenAPI. TermScout publishes no object
  reference page, so id prefixes and value domains below are recorded only where
  the spec itself states them; everything else is marked unknown rather than
  guessed.

root_entity: Contract

entities:
- name: Contract
  description: >-
    A commercial agreement submitted for analysis. Created by POST /contracts,
    which returns contract_id + document_id. Everything else in this model hangs
    off contract_id.
  identifier: contract_id
  identifier_type: string
  id_format: unknown
  schemas:
  - ContractUpload
  - ContractStatus
  - ContractList
  - ContractOverview
  operations:
  - POST /contracts
  - GET /contracts
  - GET /contracts/{contract-id}/status
  - GET /contracts/{contract-id}/overview
  relationships:
  - type: has_one
    target: ContractOverview
    via: contract-id
  - type: has_one
    target: ContractStatus
    via: contract-id
  - type: has_many
    target: ExtractedField
    via: contract-id
  - type: has_many
    target: Citation
    via: contract-id
  - type: has_one
    target: PredictionDetail
    via: contract-id
  - type: has_one
    target: PredictionFlags
    via: contract-id
  - type: has_many
    target: PlaybookDetail
    via: contract-id
  - type: belongs_to
    target: Template
    via: template_id

- name: Document
  description: >-
    The uploaded file backing a contract. Returned alongside contract_id on
    upload and replaceable via the document-id parameter on a subsequent POST.
  identifier: document_id
  identifier_type: string
  schemas:
  - ContractUpload
  relationships:
  - type: belongs_to
    target: Contract
    via: contract_id
  note: >-
    Has no endpoints of its own — no GET, no delete. Only ever appears as a field
    on the upload response and as an input parameter when replacing a document.

- name: Template
  description: >-
    The contract type/form a contract is analysed against (the spec notes the IT
    template is the default on GET /contract-positions). Determines which
    questions, labels and topics apply.
  identifier: template_id
  identifier_type: number
  schemas:
  - ContractOverview
  relationships:
  - type: has_one
    target: Template
    via: parent_template_id
    note: Self-reference — templates nest via parent_template_id.
  exposed_as_endpoint: false
  note: >-
    Required input on both POST /contracts and GET /contract-positions, but
    there is NO endpoint to list or look up templates. A caller must obtain
    valid template ids out of band. This is the single largest discoverability
    gap in the model.

