scope_note: >-
  IMPORTANT — these are PRODUCT plans, not API plans. The tiers below price
  TrustMark certification and Certify seats. TermScout publishes no pricing,
  metering, quota or rate tier for the termscout-data API at
  api.termscout.com, and no plan below mentions API access. API access is
  arranged through sales (https://www.termscout.com/contact-sales). Recorded
  here because they are the only plans the provider publishes.

