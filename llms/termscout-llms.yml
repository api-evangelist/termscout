  TermScout publishes a real llms.txt and it is well formed — H1, a blockquote
  summary, four sectioned link lists and an Optional section, per the llms.txt
  convention. Saved verbatim; not generated by API Evangelist.

  Two things about it are worth recording. First, it is served from
  app.termscout.com — the application host — and NOT from termscout.com,
  www.termscout.com or learn.termscout.com, all of which 404 on /llms.txt. An
  agent checking the obvious marketing host will conclude TermScout publishes
  nothing.

  Second, it indexes the company's public TrustMark contract reports rather than
  its product or developer documentation. It makes no reference to the
  termscout-data API, to https://api.termscout.com/docs, or to any other
  machine-readable contract — so the llms.txt and the OpenAPI are two disjoint
  discovery surfaces, neither of which points at the other.
